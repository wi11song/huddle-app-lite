name: Deploy

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

permissions:
  actions: read
  contents: read

concurrency:
  group: lan-production
  cancel-in-progress: false

jobs:
  inspect:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: [self-hosted, linux, x64, huddle-deploy]
    outputs:
      artifact-found: ${{ steps.artifact.outputs.found }}
    steps:
      - id: artifact
        name: Find release artifact
        uses: actions/github-script@v7
        env:
          ARTIFACT_NAME: huddle-app-${{ github.event.workflow_run.head_sha }}
        with:
          script: |
            const response = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.payload.workflow_run.id,
            });
            const found = response.data.artifacts.some(
              artifact => artifact.name === process.env.ARTIFACT_NAME
            );
            core.setOutput("found", found ? "true" : "false");
            if (!found) {
              core.notice("No release artifact was produced; deployment is skipped.");
            }

  deploy:
    needs: inspect
    if: needs.inspect.outputs.artifact-found == 'true'
    runs-on: [self-hosted, linux, x64, huddle-deploy]
    environment:
      name: lan-production
      url: http://huddle.internal:8000
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: huddle-app-${{ github.event.workflow_run.head_sha }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: artifact

      - name: Verify artifact checksum
        working-directory: artifact
        run: sha256sum --check *.sha256

      - name: Deploy exact revision
        env:
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: /usr/local/sbin/deploy-huddle-app "$GITHUB_WORKSPACE/artifact" "$RELEASE_SHA"
